# Reios on this laptop: nginx in front of several API instances.
#   Internet -> Cloudflare tunnel -> nginx :8080 -> API instances 127.0.0.1:8001-8004 -> PostgreSQL
#
# nginx for Windows only scales with one worker and caps it at 1024 connections; each proxied
# request holds two (client + upstream), so ~500 requests in flight at once. Plenty for 150-200 teams.

worker_processes  1;
error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout  65;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time up=$upstream_addr cache=$upstream_cache_status';
    access_log logs/access.log main buffer=64k flush=5s;

    # Traffic arrives from cloudflared on this machine; Cloudflare passes the participant's real IP.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header   CF-Connecting-IP;

    # --- Compression -------------------------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Load balancer ------------------------------------------------------------------------
    # least_conn sends each request to the instance with the fewest in flight, so one slow request
    # (a big results export) doesn't queue others behind it. A crashed instance is skipped for 10s.
    upstream reios_api {
        least_conn;
        server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8002 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8003 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8004 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # --- Content cache ------------------------------------------------------------------------
    # Only for public, identical-for-everyone responses. Signed-in API data is never cached.
    proxy_cache_path cache levels=1:2 keys_zone=reios_cache:10m max_size=200m inactive=10m use_temp_path=off;

    # --- Rate limiting ------------------------------------------------------------------------
    # A whole venue can share ONE public IP, so per-IP limits are generous and per-person limits use
    # the sign-in token instead. Brute-force password guessing is also stopped by the app's own
    # lockout (5 wrong passwords -> 10 minutes).
    map $http_authorization $rl_user_key {
        ""      $binary_remote_addr;
        default $http_authorization;
    }
    limit_req_zone $rl_user_key        zone=per_user:20m rate=15r/s;   # one signed-in team/admin
    limit_req_zone $binary_remote_addr zone=per_ip:10m   rate=150r/s;  # a whole venue/NAT
    limit_req_zone $binary_remote_addr zone=login_ip:10m rate=10r/s;   # sign-in attempts
    limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level warn;

    server {
        listen       8080;
        server_name  _;
        client_max_body_size 25m;          # question papers / team lists uploads
        root         C:/reios-server/web;

        limit_conn conn_ip 600;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        # If an instance is down or refuses the connection, try another one (never re-sends a POST
        # that already reached an instance, so nothing is submitted twice).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;

        # Sign-in: a venue of 150 teams logging in together fits in the burst.
        location = /api/reios/auth/login {
            limit_req zone=login_ip burst=250 nodelay;
            proxy_pass http://reios_api;
            add_header X-Upstream $upstream_addr always;
        }

        # Public and the same for everyone: cache briefly.
        location ~ ^/api/reios/auth/(config|branding)$ {
            proxy_cache            reios_cache;
            proxy_cache_key        $request_uri;
            proxy_cache_valid      200 60s;
            proxy_cache_lock       on;
            proxy_cache_use_stale  error timeout updating http_502 http_503;
            proxy_ignore_headers   Cache-Control Expires Set-Cookie;
            add_header X-Cache-Status $upstream_cache_status always;
            proxy_pass http://reios_api;
        }

        location /api/ {
            limit_req zone=per_user burst=60 nodelay;
            limit_req zone=per_ip   burst=600 nodelay;
            proxy_pass http://reios_api;
            add_header X-Upstream $upstream_addr always;
        }

        # Built site files have a content hash in their name, so they can be cached for a year.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /nginx-status {
            allow 127.0.0.1;
            deny all;
            stub_status;
        }

        # Single-page app: any other path is a React route.
        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
