# Render Blueprint for the Reios backend + PostgreSQL (no Docker: Render's native Python runtime).
# Render dashboard -> New -> Blueprint -> pick this repository. The website itself is deployed on Vercel.
services:
  - type: web
    name: reios-api
    runtime: python
    # Render's rootDir can't contain "(" so the commands change into the backend folder themselves
    buildCommand: cd "Exam Webpage (3)/Exam Webpage/coding-test-platform/backend" && pip install -r requirements.txt
    startCommand: cd "Exam Webpage (3)/Exam Webpage/coding-test-platform/backend" && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --no-access-log
    healthCheckPath: /api/health
    plan: free   # fine for trying it; use a paid plan (and more --workers) for real exams
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DATABASE_URL
        fromDatabase:
          name: reios-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: FIREBASE_PROJECT_ID
        value: reios-51093
      - key: SUPER_ADMIN_EMAIL
        sync: false   # Render asks for it: the super admin's Firebase email(s), comma-separated
      - key: WORKER_THREADS
        value: "60"

databases:
  - name: reios-db
    plan: free
    databaseName: reios
