<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECHSPRINT 2026 • Admin Command Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-blueprint: #090d16;
            --bg-panel: #111827;
            --bg-dark-panel: #0b0f19;
            --line-white: #f3f4f6;
            --line-dim: rgba(139, 92, 246, 0.25);
            --line-faint: rgba(6, 182, 212, 0.08);
            --accent-signal: #06b6d4;
            --accent-stamp: #8b5cf6;
            --text-bright: #ffffff;
            --text-dim: #94a3b8;
            --text-muted: #64748b;
            --font-display: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
            --font-body: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: "JetBrains Mono", monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-body);
            background-color: var(--bg-blueprint);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 80% 90%, rgba(6, 182, 212, 0.1) 0%, transparent 50%),
                linear-gradient(90deg, var(--line-faint) 1px, transparent 1px),
                linear-gradient(var(--line-faint) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            color: var(--text-dim);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }
        
        .container {
            background: rgba(17, 24, 39, 0.92);
            border: 1.5px solid var(--line-dim);
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(139, 92, 246, 0.15);
            border-radius: 20px;
            padding: 44px 40px;
            max-width: 460px;
            width: 100%;
            position: relative;
            z-index: 1;
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 24px;
        }
        
        .event-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-mono);
            color: #22d3ee;
            border: 1.5px solid rgba(6, 182, 212, 0.4);
            background-color: rgba(6, 182, 212, 0.12);
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        
        h1 {
            font-family: var(--font-display);
            text-align: center;
            color: var(--text-bright);
            margin-bottom: 6px;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 30%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            text-align: center;
            color: var(--text-dim);
            margin-bottom: 28px;
            font-size: 12px;
            font-family: var(--font-mono);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--line-white);
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        
        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(18, 58, 99, 0.5);
            border: 1.5px solid var(--line-dim);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-bright);
            transition: border-color 0.2s ease;
            font-family: var(--font-body);
        }
        
        input:focus {
            outline: none;
            background: rgba(18, 58, 99, 0.85);
            border-color: var(--accent-signal);
        }
        
        button.btn-illuminated {
            width: 100%;
            padding: 14px 20px;
            background-color: var(--accent-signal);
            color: var(--bg-blueprint) !important;
            border: 2px solid var(--accent-signal);
            border-radius: 9999px;
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.15s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }
        
        button.btn-illuminated:hover {
            background-color: #ffca28;
            transform: translateY(-1px);
        }
        
        .error {
            background: rgba(232, 72, 60, 0.15);
            color: #ff8a80;
            border: 1px solid var(--accent-stamp);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            font-family: var(--font-mono);
            display: none;
        }
        
        .success {
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
            border: 1px solid #22c55e;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            font-family: var(--font-mono);
            display: none;
        }
        
        .info-section {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid var(--line-faint);
            text-align: center;
        }
        
        .info-text {
            color: var(--text-muted);
            font-size: 11px;
            font-family: var(--font-mono);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <div class="event-badge">Private Access • Admin Command</div>
            <h1>TECHSPRINT Admin</h1>
            <p class="subtitle">Hackathon Proctoring & Live Evaluation</p>
        </div>
        
        <div id="error" class="error"></div>
        <div id="success" class="success"></div>
        
        <form id="admin-login-form" onsubmit="loginAdmin(event)">
            <div class="form-group">
                <label for="admin-username">Admin Username</label>
                <input type="text" id="admin-username" placeholder="Enter admin username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="admin-password">Password</label>
                <input type="password" id="admin-password" placeholder="Enter admin password" required autocomplete="off">
            </div>
            <button type="submit" class="btn-illuminated">Access Dashboard</button>
        </form>
        
        <div class="info-section">
            <p class="info-text">
                Authorized Personnel Only • IP Address Logged
            </p>
        </div>
    <script src="config.js"></script>
    <script>
        const API_BASE = window.APP_CONFIG ? window.APP_CONFIG.getApiBase() : (
            (window.location.protocol.startsWith('http') && window.location.hostname)
                ? `${window.location.protocol}//${window.location.hostname}:8000`
                : 'http://localhost:8000'
        );
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('success').style.display = 'none';
        }
        
        function showSuccess(message) {
            const successDiv = document.getElementById('success');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            document.getElementById('error').style.display = 'none';
        }
        
        function hideMessages() {
            document.getElementById('error').style.display = 'none';
            document.getElementById('success').style.display = 'none';
        }
        
        async function loginAdmin(event) {
            event.preventDefault();
            hideMessages();
            
            const username = document.getElementById('admin-username').value;
            const password = document.getElementById('admin-password').value;
            
            try {
                const response = await fetch(`${API_BASE}/api/auth/admin/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || 'Login failed');
                }
                
                // Store token
                localStorage.setItem('token', data.access_token);
                localStorage.setItem('role', 'admin');
                localStorage.setItem('user_info', JSON.stringify(data.user_info));
                
                showSuccess('Admin authenticated. Redirecting to Command Center...');
                
                setTimeout(() => {
                    window.location.href = 'admin-dashboard.html';
                }, 800);
                
            } catch (error) {
                if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError') || error.message.includes('fetch')) {
                    showError(`⚠️ Cannot reach backend server at [${API_BASE}]. If you are on Vercel, please connect via your Local Network: http://192.168.0.118:3000 or configure backend HTTPS URL.`);
                } else {
                    showError(error.message);
                }
            }
        }
    </script>
</body>
</html>
