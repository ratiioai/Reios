<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reios — My Exams</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="reios.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="../config.js"></script>
  <script src="reios.js"></script>
  <style>
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px 72px; }
    header.bar {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      flex-wrap: wrap; padding: 14px 0; margin-bottom: 22px;
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    @supports not (background: color-mix(in srgb, red, blue)) { header.bar { background: var(--bg); } }
    .exam-card {
      display: flex; justify-content: space-between; gap: 18px; align-items: center;
      flex-wrap: wrap; position: relative; overflow: hidden; margin-bottom: 12px;
    }
    .exam-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--border-strong); }
    .exam-card.s-live::before { background: var(--success); }
    .exam-card.s-in_progress::before { background: var(--warning); }
    .exam-card.s-upcoming::before { background: var(--primary); }
    .exam-card.s-completed::before { background: var(--success); opacity: .45; }
    .exam-card.s-missed::before { background: var(--danger); opacity: .55; }
    .exam-card h3 { margin: 0 0 5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .exam-card .meta { color: var(--muted); font-size: 12.5px; }
    .section-bar { display: grid; grid-template-columns: 170px 1fr 92px; gap: 12px; align-items: center; margin: 9px 0 2px; }
    @media (max-width: 560px) { .section-bar { grid-template-columns: 1fr 70px; } .section-bar .progress { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="bar">
      <div class="brand" style="padding:0">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="url(#g)"/>
          <circle cx="16" cy="16" r="8" fill="none" stroke="#fff" stroke-width="2.6" opacity=".5"/>
          <circle cx="16" cy="16" r="3.6" fill="#fff"/>
          <defs><linearGradient id="g" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/></linearGradient></defs>
        </svg>
        <span class="wordmark">Reios<span class="sub" id="college-name"></span></span>
      </div>
      <div class="row tight">
        <span class="muted small" id="who"></span>
        <button class="btn sm" id="pwd">Change password</button>
        <button class="btn ghost sm" onclick="Reios.toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
        <button class="btn sm" onclick="Reios.logout()">Sign out</button>
      </div>
    </header>
    <div id="view"><div class="loading"><span class="spinner lg"></span> Loading…</div></div>
  </div>

<script>
(function () {
  const { api, esc, fmtDate, fmtDuration, toast, modal } = Reios;
  const user = Reios.requireRole(["student"]);
  const view = document.getElementById("view");
  document.getElementById("who").textContent = `${user.name} · ${user.roll_no}`;
  document.getElementById("college-name").textContent = user.college ? user.college.name : "Student";
  document.getElementById("pwd").onclick = () => passwordForm(false);

  function badge(text, color) { return `<span class="badge ${color || ""}">${esc(text)}</span>`; }

  function passwordForm(forced) {
    const form = document.createElement("div");
    form.innerHTML = `
      ${forced ? `<p>You're using a temporary password from your college. Set your own password before taking exams.</p>` : ""}
      <div class="field"><label>Current password</label><input type="password" id="cur" autocomplete="current-password"></div>
      <div class="field"><label>New password (min 8 characters)</label><input type="password" id="new1" autocomplete="new-password"></div>
      <div class="field"><label>Confirm new password</label><input type="password" id="new2" autocomplete="new-password"></div>`;
    const actions = [{ label: "Update password", cls: "primary", onClick: async close => {
      const n1 = form.querySelector("#new1").value;
      if (n1 !== form.querySelector("#new2").value) return toast("Passwords don't match", "error");
      try {
        const r = await api("POST", "/api/reios/auth/change-password", { current_password: form.querySelector("#cur").value, new_password: n1 });
        Reios.auth.save(r.access_token, r.user);
        toast("Password updated", "success"); close(); load();
      } catch (err) { toast(err.message, "error"); }
    } }];
    if (!forced) actions.unshift({ label: "Cancel" });
    const m = modal({ title: forced ? "Set your password" : "Change password", body: form, actions });
    if (forced) m.el.querySelector("[data-close]").remove();
  }

  function examCard(e) {
    let action = "", status = "";
    switch (e.state) {
      case "live":
        status = `<span class="badge green dot">Open now</span>`;
        action = `<a class="btn primary lg" href="exam.html?exam=${e.id}">Start exam</a>`; break;
      case "in_progress":
        status = `<span class="badge amber dot">In progress</span>`;
        action = `<a class="btn primary lg" href="exam.html?exam=${e.id}">Resume exam</a>`; break;
      case "upcoming":
        status = badge("Scheduled", "blue");
        action = `<span class="muted small nums" data-countdown="${new Date(e.start_at).getTime()}"></span>`; break;
      case "completed":
        status = badge("Completed", "green");
        action = e.result_available ? `<button class="btn" data-result="${e.attempt_id}">View result${e.score !== null ? ` · ${e.score}/${e.max_score}` : ""}</button>`
                                    : `<span class="muted small">Results will be shared by your college</span>`; break;
      case "missed":
        status = badge("Missed", "red");
        action = `<span class="muted small">Window closed</span>`; break;
    }
    return `<div class="card hoverable exam-card s-${e.state}">
      <div class="grow"><h3>${esc(e.title)} ${status}</h3>
        <div class="meta">${fmtDate(e.start_at)} → ${fmtDate(e.end_at)} · ${e.duration_minutes} min · ${e.question_count} questions · ${e.max_score} marks</div>
        ${e.sections.length ? `<div class="pill-list" style="margin-top:8px">${e.sections.map(s => badge(s, "outline")).join("")}</div>` : ""}
        ${e.description ? `<div class="small muted" style="margin-top:7px">${esc(e.description)}</div>` : ""}
      </div>
      <div>${action}</div></div>`;
  }

  let countdownTimer;
  async function load() {
    clearInterval(countdownTimer);
    try {
      const me = await api("GET", "/api/reios/auth/me");
      if (me.must_change_password) passwordForm(true);
      const d = await api("GET", "/api/reios/student/dashboard");
      const order = { in_progress: 0, live: 1, upcoming: 2, completed: 3, missed: 4 };
      const exams = d.exams.slice().sort((a, b) => order[a.state] - order[b.state] || new Date(a.start_at) - new Date(b.start_at));
      const active = exams.filter(e => ["in_progress", "live", "upcoming"].includes(e.state));
      const past = exams.filter(e => ["completed", "missed"].includes(e.state));
      const liveCount = active.filter(e => e.state === "live" || e.state === "in_progress").length;
      view.innerHTML = `
        <div class="page-head">
          <h1>Hi, ${esc(user.name.split(" ")[0])}</h1>
          <p class="lede">${liveCount ? `You have ${liveCount} exam${liveCount > 1 ? "s" : ""} open right now.`
                                      : "Nothing open at the moment. Scheduled exams appear below."}</p>
        </div>
        <div class="grid cols-4" style="margin-bottom:24px">
          <div class="stat green"><div class="label">Exams completed</div><div class="value">${d.stats.completed}</div></div>
          <div class="stat"><div class="label">Average score</div><div class="value">${d.stats.average_percentage === null ? "—" : d.stats.average_percentage + "%"}</div></div>
          <div class="stat amber"><div class="label">Upcoming / open</div><div class="value">${d.stats.upcoming}</div></div>
          <div class="stat plain"><div class="label">Branch</div><div class="value" style="font-size:19px">${esc(user.branch || "—")} ${esc(user.section || "")}</div>
            <div class="sub">${esc(user.roll_no || "")}</div></div>
        </div>
        ${d.announcements.length ? `<div class="banner" style="margin-bottom:20px;flex-direction:column;gap:9px">
          <h3 style="margin:0">Announcements</h3>
          ${d.announcements.map(a => `<div><strong>${esc(a.title)}</strong> <span class="muted tiny">${fmtDate(a.created_at)}</span>
          <div class="small" style="white-space:pre-wrap;margin-top:2px">${esc(a.body)}</div></div>`).join("")}</div>` : ""}
        <div class="section-title"><h2>Your exams</h2></div>
        ${active.map(examCard).join("") || `<div class="card empty"><span class="big">No exams open</span>
          <span class="small">Your college will schedule them here.</span></div>`}
        ${past.length ? `<div class="section-title"><h2>Past exams</h2></div>${past.map(examCard).join("")}` : ""}`;
      view.querySelectorAll("[data-result]").forEach(b => b.onclick = () => showResult(b.dataset.result));
      const tick = () => {
        let reload = false;
        view.querySelectorAll("[data-countdown]").forEach(el => {
          const left = (Number(el.dataset.countdown) - Date.now()) / 1000;
          if (left <= 0) reload = true;
          el.textContent = left > 86400 ? `Opens ${fmtDate(Number(el.dataset.countdown))}` : `Opens in ${fmtDuration(left)}`;
        });
        if (reload) load();
      };
      tick();
      countdownTimer = setInterval(tick, 1000);
      const params = new URLSearchParams(location.search);
      if (params.get("result")) { showResult(params.get("result")); history.replaceState(null, "", "student.html"); }
    } catch (err) {
      if (err.message !== "redirecting") view.innerHTML = `<div class="card empty">${esc(err.message)}</div>`;
    }
  }

  async function showResult(attemptId) {
    try {
      const r = await api("GET", `/api/reios/student/attempts/${attemptId}/result`);
      const reason = { time_up: "Submitted automatically when time ran out.", max_violations: "Submitted automatically because of repeated anti-cheat violations.",
                       admin_force_submit: "Submitted by the exam administrator." }[r.submit_reason] || "";
      const review = r.review.map((x, i) => x.type === "mcq" ? `
        <div class="card" style="padding:12px;margin-bottom:8px">
          <div class="row between"><strong class="small">${esc(x.section)}</strong>
            <span>${!x.selected.length ? badge("Not answered") : x.marks_awarded > 0 ? badge("Correct", "green") : badge("Wrong", "red")} ${x.marks_awarded}/${x.marks}</span></div>
          <div class="md">${Reios.markdown(x.question_text)}</div>
          <ol class="option-list">${x.options.map((o, oi) => `<li class="${x.correct_options.includes(oi) ? "correct" : x.selected.includes(oi) ? "wrong" : ""}">${esc(o)}${x.selected.includes(oi) ? " ← your answer" : ""}</li>`).join("")}</ol>
          ${x.explanation ? `<div class="small muted"><strong>Explanation:</strong> ${esc(x.explanation)}</div>` : ""}
        </div>` : `
        <div class="card" style="padding:12px;margin-bottom:8px">
          <div class="row between"><strong>${esc(x.title)}</strong><span>${x.passed_tests}/${x.total_tests} hidden tests · ${x.marks_awarded}/${x.marks}</span></div>
          ${x.code ? `<pre>${esc(x.code)}</pre>` : `<p class="muted small">No code submitted</p>`}
        </div>`).join("");
      modal({
        title: r.exam.title, wide: true,
        body: `
          <div class="grid cols-4" style="margin-bottom:16px">
            <div class="stat"><div class="label">Score</div><div class="value">${r.total_score}<span class="muted" style="font-size:15px"> / ${r.max_score}</span></div></div>
            <div class="stat"><div class="label">Percentage</div><div class="value">${r.percentage}%</div></div>
            <div class="stat ${r.passed ? "green" : "red"}"><div class="label">Result</div><div class="value" style="color:${r.passed ? "var(--success)" : "var(--danger)"}">${r.passed ? "Pass" : "Fail"}</div></div>
            <div class="stat plain"><div class="label">Rank</div><div class="value">${r.rank}<span class="muted" style="font-size:15px"> / ${r.participants}</span></div></div>
          </div>
          ${reason ? `<p class="small" style="color:var(--warning)">${esc(reason)}</p>` : ""}
          <h3>Section-wise performance</h3>
          ${r.sections.map(s => `<div class="section-bar"><strong class="small">${esc(s.section)}</strong>
            <div class="progress"><span style="width:${s.max ? Math.max(0, s.score / s.max * 100) : 0}%"></span></div>
            <span class="small num">${s.score} / ${s.max}</span></div>
            <div class="muted small" style="margin:-4px 0 8px">${s.correct} correct · ${s.wrong} wrong · ${s.unanswered} unanswered</div>`).join("")}
          ${review ? `<h3 style="margin-top:16px">${r.answers_visible ? "Answer review" : "Your coding answers"}</h3>${review}` : ""}`,
      });
    } catch (err) { toast(err.message, "error"); }
  }

  load();
})();
</script>
</body>
</html>
