<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reios — Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="reios.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="../config.js"></script>
  <script src="reios.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="url(#g)"/>
          <circle cx="16" cy="16" r="8" fill="none" stroke="#fff" stroke-width="2.6" opacity=".5"/>
          <circle cx="16" cy="16" r="3.6" fill="#fff"/>
          <defs><linearGradient id="g" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#4338ca"/></linearGradient></defs>
        </svg>
        <span class="wordmark">Reios<span class="sub" id="brand-text">Console</span></span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="row between">
          <span class="tiny faint">Signed in</span>
          <div class="row tight">
            <button class="btn ghost sm" onclick="Reios.toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode">◐</button>
            <button class="btn ghost sm" onclick="Reios.logout()">Sign out</button>
          </div>
        </div>
      </div>
    </aside>
    <main class="main">
      <div class="topbar">
        <div class="row">
          <button class="btn sm menu-toggle" id="menu-toggle" aria-label="Menu">☰</button>
          <div id="college-picker-wrap" class="row tight hidden">
            <label for="college-picker" style="margin:0">College</label>
            <select id="college-picker" style="width:auto;min-width:220px"></select>
          </div>
        </div>
        <div class="row tight">
          <span class="who" id="who"></span>
        </div>
      </div>
      <div id="view"><div class="loading"><span class="spinner lg"></span> Loading…</div></div>
    </main>
  </div>
  <script src="console.js"></script>
</body>
</html>
